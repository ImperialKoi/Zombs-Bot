<!doctype html><html lang="en"><meta charset="utf-8"><title>Zombs replay</title><style>body{background:#10161e;color:#e4eef8;font:15px system-ui;margin:24px}main{display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,1fr);gap:24px}canvas{width:100%;background:#000}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c2939;padding:16px;border-radius:10px}input{width:75%}button{padding:9px 16px;background:#206661;color:white;border:0;border-radius:6px}#meta{color:#a9bfcd}</style>
<h1>Recorded decisions</h1><p id="meta"></p><main><section><canvas id="canvas"></canvas><p><button id="play">Play</button> <input type="range" min="0" value="0" id="seek"></p></section><aside><h2 id="reason"></h2><pre id="details"></pre><p>Replay only. This page sends no game input.</p></aside></main><script>
const rows=__DATA__;const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),seek=document.getElementById('seek');seek.max=Math.max(0,rows.length-1);let timer;
function show(index){const row=rows[index];if(!row)return;seek.value=index;document.getElementById('meta').textContent=`Frame ${index+1}/${rows.length} · ${row.timestamp.toFixed(3)}s`;document.getElementById('reason').textContent=row.decision?.reason??'No decision';document.getElementById('details').textContent=JSON.stringify({health:row.observation?.health,shield:row.observation?.shield,selectedSlot:row.observation?.selectedSlot,intents:row.decision?.intents},null,2);const image=new Image();image.onload=()=>{canvas.width=image.width;canvas.height=image.height;ctx.drawImage(image,0,0);for(const player of row.observation?.players??[]){ctx.strokeStyle=player.affiliation==='enemy'?'#ff8879':player.affiliation==='teammate'?'#6ef7ad':'#d0dae0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.position.x*canvas.width,player.position.y*canvas.height,20,0,Math.PI*2);ctx.stroke()}for(const intent of row.decision?.intents??[]){if(intent.aim){const p=intent.aim._0;ctx.strokeStyle='#ffd36a';ctx.beginPath();ctx.moveTo((p.x-.02)*canvas.width,p.y*canvas.height);ctx.lineTo((p.x+.02)*canvas.width,p.y*canvas.height);ctx.moveTo(p.x*canvas.width,(p.y-.03)*canvas.height);ctx.lineTo(p.x*canvas.width,(p.y+.03)*canvas.height);ctx.stroke()}}};image.src=row.image}
seek.oninput=()=>show(Number(seek.value));document.getElementById('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;return}timer=setInterval(()=>{const next=Number(seek.value)+1;if(next>=rows.length){clearInterval(timer);timer=null}else show(next)},200)};show(0);
</script></html>
